# Credential-free public fallback example.
exchange = "polymarket"

[polymarket]
gamma_url = "https://gamma-api.polymarket.com"
ws_url = "wss://ws-subscriptions-clob.polymarket.com/ws/market"
batch_size = 500
# Gamma's keyset endpoint accepts at most 100 records per page.
discovery_page_size = 100
request_timeout_secs = 20
discovery_page_delay_ms = 50
# Strict policy: only an explicit acceptingOrders == true is tradable. A
# missing field is unconfirmed and excluded while this is enabled.
require_accepting_orders = true

[collector]
shards = 0
replicas = 2
max_symbols_per_socket = 5000
max_shards = 64
snapshot_interval_secs = 60
discovery_interval_secs = 30
reconnect_after_secs = 1800
connection_idle_timeout_secs = 45
stale_probe_after_secs = 120
probe_interval_secs = 30
max_probes = 3
final_snapshots = true
writer_queue = 16384
flush_interval_secs = 1
max_markets = 20
duration_secs = 0
writer_send_timeout_secs = 30
max_total_connections = 64
max_initial_subscription_bytes = 1048576
max_estimated_book_memory_mb = 1024
max_snapshot_bytes_per_sec = 16777216
connect_concurrency = 8
# catalog_path = "captures/polymarket-catalog.json"
catalog_mode = "off"
catalog_max_age_secs = 3600
allow_empty_catalog = false
readiness_min_anchored_fraction = 0.99
readiness_max_catalog_age_secs = 3600
readiness_max_stale_secs = 120

[network]
tcp_nodelay = true
# source_ip = "192.0.2.10"
# source_port = 40000
connect_race = 1
# Deadline for one full connection attempt, including every raced candidate.
connect_timeout_secs = 30

[output]
path = "captures/polymarket.sbe"
# 64 MiB matches the template AlignedSbeReader default. Flushes are
# incremental; padding is written only at rotation and on close.
chunk_size = 67108864
metadata_path = "captures/polymarket-markets.json"
report_path = "captures/polymarket-report.json"
sync_on_close = true
overwrite = false
rotate_bytes = 0
rotate_secs = 0
min_free_bytes = 0
fsync_interval_secs = 0

[metrics]
listen = "127.0.0.1:9090"

[journal]
# Uncomment to retain every received public data frame next to the SBE
# capture. Each run creates a new subdirectory with a manifest and checksummed
# segments. A full queue, write failure, sync failure, or finalization timeout
# fails the run instead of dropping a frame.
# directory = "captures/polymarket-journal"
queue_capacity = 4096
enqueue_timeout_ms = 250
flush_interval_ms = 1000
sync_interval_ms = 5000
segment_max_bytes = 268435456
segment_max_secs = 300
sync_mode = "interval"
