# Kalshi collector example. Credentials may also come from KALSHI_API_KEY_ID,
# KALSHI_PRIVATE_KEY_PATH, or KALSHI_PRIVATE_KEY_PEM.
exchange = "kalshi"

[kalshi]
# Production is the built-in default because the challenge targets live
# markets. Use "demo" with demo credentials for a simulated exchange.
environment = "production"
key_id = ""
# private_key_path = "/absolute/path/to/kalshi-private-key.pem"
batch_size = 100
discovery_page_size = 1000
request_timeout_secs = 20
discovery_page_delay_ms = 50

[collector]
# 0 derives the shard count from the initial symbol count and the soft socket
# capacity below. A non-zero value is fixed for the run.
shards = 0
replicas = 2
max_symbols_per_socket = 5000
max_shards = 64
snapshot_interval_secs = 60
discovery_interval_secs = 30
reconnect_after_secs = 1800
connection_idle_timeout_secs = 45
stale_probe_after_secs = 120
probe_interval_secs = 30
max_probes = 3
final_snapshots = true
writer_queue = 16384
flush_interval_secs = 1
max_markets = 0
duration_secs = 0
writer_send_timeout_secs = 30
# Hard startup gates. The capacity plan is rejected before any socket opens
# when these are exceeded. max_markets counts venue records, not outcome
# tokens.
max_total_connections = 64
max_initial_subscription_bytes = 1048576
max_estimated_book_memory_mb = 1024
max_snapshot_bytes_per_sec = 16777216
connect_concurrency = 8
# Last-known-good discovery checkpoint. Modes: off, warm, require, stale.
# catalog_path = "captures/kalshi-catalog.json"
catalog_mode = "off"
catalog_max_age_secs = 3600
allow_empty_catalog = false
readiness_min_anchored_fraction = 0.99
readiness_max_catalog_age_secs = 3600
readiness_max_stale_secs = 120

[network]
# Transport controls for every websocket connection. TCP_NODELAY is enabled by
# default because order-book frames are small and latency-sensitive. Race
# several full handshakes with connect_race > 1 and keep the first success.
# source_port is a base: connection shard*256+replica binds base + that
# ordinal, so parallel connections never collide; a fixed port cannot be
# combined with racing.
tcp_nodelay = true
# source_ip = "192.0.2.10"
# source_port = 40000
connect_race = 1
# Deadline for one full connection attempt (DNS, TCP, TLS, websocket upgrade,
# including every raced candidate).
connect_timeout_secs = 30

[output]
path = "captures/kalshi.sbe"
# Matches the template reader's default. Periodic flushes write only encoded
# bytes; the final chunk is padded on close.
chunk_size = 67108864
metadata_path = "captures/kalshi-markets.json"
report_path = "captures/kalshi-report.json"
sync_on_close = true
# Existing capture, sidecar, catalog, manifest, and segment files are startup
# errors unless this is true.
overwrite = false
# Rotation writes <path>.<sequence>.sbe segments, a checksummed manifest, and
# an atomic rename per segment. Zero disables size or time rotation.
rotate_bytes = 0
rotate_secs = 0
# Stop before the output filesystem falls below this many free bytes. The
# watermark is checked at most once every five seconds. Zero disables it.
min_free_bytes = 0
# Periodic fsync of the active capture or segment. Zero syncs only on
# rotation and shutdown.
fsync_interval_secs = 0

[metrics]
listen = "127.0.0.1:9090"

[journal]
# Uncomment to retain every received public data frame. Each run creates a new
# subdirectory with a manifest and checksummed segments.
# directory = "captures/kalshi-journal"
queue_capacity = 4096
enqueue_timeout_ms = 250
flush_interval_ms = 1000
sync_interval_ms = 5000
segment_max_bytes = 268435456
segment_max_secs = 300
sync_mode = "interval"
